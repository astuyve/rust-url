[package]
name = "percent-encoding"
version = "2.3.2"
authors = ["The rust-url developers"]
description = "Percent encoding and decoding"
categories = ["no-std"]
repository = "https://github.com/servo/rust-url/"
license = "MIT OR Apache-2.0"
edition = "2018"
rust-version = "1.51"
# Benchmarks and their results are for development only; keep them out of the
# published crate.
exclude = ["BENCHMARKS.md", "benches/"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition"]

[dev-dependencies]
bencher = "0.1"

[[bench]]
name = "percent_encoding"
harness = false
